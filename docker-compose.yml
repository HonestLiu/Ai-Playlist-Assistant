# AI 音乐歌单助手 — Docker 部署
#
# 推荐做法：把容器 /app/data 绑定挂载到主机目录，数据持久化、重建容器/更新镜像都不丢。
# 先在主机建目录并放行权限（容器以非 root 的 appuser 运行，否则写不了 SQLite）：
#   mkdir -p ./data && chmod 777 ./data
# 然后：docker compose up -d
#
# 不想挂载、临时体验：把下面 volumes 段整段注释掉即可（数据存于容器内部，docker rm 会清空）。

services:
  ai-playlist:
    image: ghcr.io/<owner>/<repo>:latest
    container_name: ai-playlist
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
